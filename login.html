       <!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peluquería SENA - Inicio de Sesión</title>
    <script>
        // 1. Intentamos obtener el token y los datos del usuario
        const token = localStorage.getItem('tokenSena');
        const usuario = localStorage.getItem('usuarioSena');

        // 2. Si YA EXISTEN el token Y el usuario, significa que YA está logueado
        if (token && usuario) {
            // Redirección inmediata al menú, sin dejar rastro en el historial del navegador
            window.location.replace('menucliente.html');
        }
    </script>
    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="./css/estilologin.css">
</head>

<body>
    <main class="login-container">
        <!-- PANEL DE INFORMACIÓN -->
        <section class="info-panel">
            <div class="info-content">
                <div class="info-logo">
                    <i class="fa-solid fa-scissors"></i>
                </div>
                <h1>Peluqueria</h1>
                <p>Sena</p>
                <span>
                    servicio con atención profesional, creatividad y amabilidad.
                    <span>
                        Accede a tu portal de gestión de citas y servicios.
                    </span>
                </span>
            </div>
        </section>

        <!-- PANEL DE LOGIN -->
        <section class="login-panel">
            <div class="login-box">
                <div class="logo-text">BIENVENIDO</div>
                <div class="subtitulo">Ingresa tus credenciales para continuar</div>

                <!-- MENSAJE DE ERROR -->
                <div id="mensajeError" class="mensaje-error" style="display: none;">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span id="textoError"></span>
                </div>

                <!-- FORMULARIO (Sin action, manejado por JS) -->
                <form id="loginForm">
                    <!-- CORREO ELECTRÓNICO (t1) -->
                    <div class="input-group">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="t1" name="t1" placeholder="Correo electrónico" autocomplete="email"
                            required autofocus>
                    </div>

                    <!-- CONTRASEÑA (t2) -->
                    <div class="input-group">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="t2" name="t2" placeholder="Contraseña"
                            autocomplete="current-password" required>
                    </div>

                    <!-- BOTÓN -->
                    <button type="submit" class="btn" id="btnSubmit">
                        <i class="fa-solid fa-right-to-bracket"></i>
                        <span>Iniciar Sesión</span>
                    </button>
                </form>

                <div class="registro">
                    <p>¿Olvidaste tu contraseña o tienes problemas?</p>
                    <a href="nuevocliente.html">
                        <i class="fa-solid fa-user-plus"></i>
                        Crear cuenta Nueva.
                    </a>
                </div>

                <div class="footer">
                    Instructor Ing (Esp, Mag) Guillo (SENA) © 2026
                </div>
            </div>
        </section>
    </main>

    <!-- =================================================
         LÓGICA JAVASCRIPT PARA CONSUMIR LA API
    ================================================= -->
    <script src="./js/jslogin.js"></script>
</body>

</html>
